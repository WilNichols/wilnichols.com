[build]
  command = "npm run netlify-build"
  publish = "_site/"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=7168"

[context.develop]
  command = "npm run netlify-build-dev"
  publish = "_site/"
  
[context.deploy-preview]
  command = "npm run netlify-build-dev"
  publish = "_site/"

[context.branch-deploy]
  command = "npm run netlify-build-dev"
  publish = "_site/"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".cache"]

[[plugins]]
  package = "netlify-plugin-debug-cache"
  
[[redirects]]
  from = "https://wil.website/*"
  to = "https://wilnichols.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wil.website/*"
  to = "https://wilnichols.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wilnichols.com/*"
  to = "https://wilnichols.com/:splat"
  status = 301
  force = true
